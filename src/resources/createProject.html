<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            padding: 30px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Ubuntu', sans-serif;
            background-color: var(--vscode-editor-background);
            color: var(--vscode-editor-foreground);
            margin: 0;
        }

        h2 {
            color: var(--vscode-titleBar-activeForeground);
            border-bottom: 2px solid var(--vscode-textLink-foreground);
            padding-bottom: 10px;
            margin-bottom: 25px;
        }

        .form-container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--vscode-editor-background);
            padding: 25px;
            border-radius: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--vscode-input-foreground);
        }

        input, select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--vscode-input-border);
            background: var(--vscode-input-background);
            color: var(--vscode-input-foreground);
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--vscode-focusBorder);
            box-shadow: 0 0 0 2px var(--vscode-focusBorder);
        }

        button {
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            font-size: 16px;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        button:hover {
            background: var(--vscode-button-hoverBackground);
        }

        .required::after {
            content: " *";
            color: var(--vscode-errorForeground);
        }

        .form-section {
            background: var(--vscode-editor-background);
            border: 1px solid var(--vscode-input-border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .minecraft-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .minecraft-title {
            font-size: 28px;
            color: var(--vscode-textLink-foreground);
            margin: 0;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 24px;
            font-size: 18px;
        }

        .input-with-icon {
            flex: 1;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--vscode-textLink-foreground);
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--vscode-input-border);
            padding-bottom: 10px;
        }

        small {
            color: var(--vscode-descriptionForeground);
            font-size: 12px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            margin-top: 10px;
        }

        .checkbox-group input {
            width: auto;
        }

        .hidden {
            display: none !important;
        }

        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--vscode-editor-background);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--vscode-textLink-foreground);
            border-top: 4px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

    <div class="form-container">
        <div class="minecraft-header">
            <h1 class="minecraft-title">🎮 New Minecraft Project</h1>
        </div>

        <!-- Project Type -->
        <div class="form-section">
            <div class="section-title">
                <span>🚀</span> Project Type
            </div>
            <div class="form-group">
                <label>Type:</label>
                <div class="input-group">
                    <span class="input-icon">🛠️</span>
                    <div class="input-with-icon">
                        <select id="projectType">
                            <option value="plugin">Minecraft Plugin (Spigot/Paper)</option>
                            <option value="fabric">Fabric Mod</option>
                            <option value="forge">Forge Mod</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Project Details -->
        <div class="form-section">
            <div class="section-title">
                <span>📦</span> Project Details
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label class="required">Project Name:</label>
                    <div class="input-group">
                        <span class="input-icon">📄</span>
                        <div class="input-with-icon">
                            <input type="text" id="projectName" placeholder="MyAwesomeProject" required>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="required">Package Name:</label>
                    <div class="input-group">
                        <span class="input-icon">📦</span>
                        <div class="input-with-icon">
                            <input type="text" id="packageName" placeholder="com.example.project" required>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Metadata Info -->
        <div class="form-section">
            <div class="section-title">
                <span>ℹ️</span> Information
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label class="required">Version:</label>
                    <div class="input-group">
                        <span class="input-icon">🏷️</span>
                        <div class="input-with-icon">
                            <input type="text" id="pluginVersion" value="1.0.0-SNAPSHOT" required>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="required">Author:</label>
                    <div class="input-group">
                        <span class="input-icon">👤</span>
                        <div class="input-with-icon">
                            <input type="text" id="authorName" placeholder="Your Name" required>
                        </div>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>Description:</label>
                <div class="input-group">
                    <span class="input-icon">📝</span>
                    <div class="input-with-icon">
                        <input type="text" id="description" placeholder="A short description" value="A Minecraft development project.">
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>Website (optional):</label>
                <div class="input-group">
                    <span class="input-icon">🌐</span>
                    <div class="input-with-icon">
                        <input type="text" id="website" placeholder="https://example.com" value="https://example.com">
                    </div>
                </div>
            </div>
        </div>

        <!-- Technical Settings -->
        <div class="form-section">
            <div class="section-title">
                <span>⚙️</span> Technical Settings
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Minecraft Version:</label>
                    <div class="input-group">
                        <span class="input-icon">🎮</span>
                        <div class="input-with-icon">
                            <select id="minecraftVersion">
                                <!-- Populated dynamically -->
                            </select>
                        </div>
                    </div>
                </div>
                <div class="form-group" id="apiVersionGroup">
                    <label>API Version:</label>
                    <div class="input-group">
                        <span class="input-icon">🔧</span>
                        <div class="input-with-icon">
                            <select id="apiVersion">
                                <option value="1.21">1.21</option>
                                <option value="1.20">1.20</option>
                                <option value="1.19">1.19</option>
                                <option value="1.18">1.18</option>
                                <option value="1.17">1.17</option>
                                <option value="1.16">1.16</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Java Version:</label>
                    <div class="input-group">
                        <span class="input-icon">☕</span>
                        <div class="input-with-icon">
                            <select id="javaVersion">
                                <option value="21">Java 21</option>
                                <option value="17">Java 17</option>
                                <option value="16">Java 16</option>
                                <option value="11">Java 11</option>
                                <option value="8">Java 8</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="form-group" id="apiTypeGroup">
                    <label>Platform:</label>
                    <div class="input-group">
                        <span class="input-icon">🛠️</span>
                        <div class="input-with-icon">
                            <select id="apiType">
                                <option value="spigot">Spigot</option>
                                <option value="paper">Paper</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Language:</label>
                    <div class="input-group">
                        <span class="input-icon">💻</span>
                        <div class="input-with-icon">
                            <select id="language">
                                <option value="java">Java</option>
                                <option value="kotlin">Kotlin</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Build System:</label>
                    <div class="input-group">
                        <span class="input-icon">🏗️</span>
                        <div class="input-with-icon">
                            <select id="buildSystem">
                                <option value="maven">Maven</option>
                                <option value="gradle">Gradle (Groovy)</option>
                                <option value="gradle-kotlin">Gradle (Kotlin DSL)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <label class="checkbox-group" id="lombokGroup">
                <input type="checkbox" id="useLombok">
                <span>Enable Lombok support (Java only)</span>
            </label>
        </div>

        <!-- Dependencies / Platform Config -->
        <div class="form-section" id="dependenciesSection">
            <div class="section-title">
                <span id="depIcon">🔗</span> <span id="depTitle">Dependencies</span>
            </div>
            
            <div id="pluginConfig">
                <div class="form-group">
                    <label>Dependencies:</label>
                    <div class="input-group">
                        <span class="input-icon">⚡</span>
                        <div class="input-with-icon">
                            <input type="text" id="dependencies" placeholder="Vault, WorldEdit">
                        </div>
                    </div>
                    <small>Comma-separated list of required dependencies</small>
                </div>
                <div class="form-group">
                    <label>Soft Dependencies:</label>
                    <div class="input-group">
                        <span class="input-icon">🔌</span>
                        <div class="input-with-icon">
                            <input type="text" id="softDependencies" placeholder="PlaceholderAPI">
                        </div>
                    </div>
                    <small>Comma-separated list of optional dependencies</small>
                </div>
            </div>

            <div id="fabricConfig" class="hidden">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Loom Version:</label>
                        <input type="text" id="loomVersion" value="1.16-SNAPSHOT">
                    </div>
                    <div class="form-group">
                        <label>Loader Version:</label>
                        <input type="text" id="loaderVersion" value="0.19.3">
                    </div>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Yarn Mappings:</label>
                        <input type="text" id="yarnMappings" placeholder="e.g. 1.21+build.1">
                    </div>
                    <div class="form-group">
                        <label>Fabric API Version:</label>
                        <input type="text" id="fabricApiVersion" value="0.141.4+1.21.11">
                    </div>
                </div>
                <label class="checkbox-group">
                    <input type="checkbox" id="fabricUseMixins" checked>
                    <span>Include Mixin support</span>
                </label>
                <label class="checkbox-group">
                    <input type="checkbox" id="fabricSplitEnv">
                    <span>Split Client/Server Environment</span>
                </label>
            </div>

            <div id="forgeConfig" class="hidden">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Forge Version:</label>
                        <input type="text" id="forgeVersion" placeholder="e.g. 47.2.0">
                    </div>
                    <div class="form-group">
                        <label>Mappings Channel:</label>
                        <input type="text" id="forgeMappingsChannel" value="official">
                    </div>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Mappings Version:</label>
                        <input type="text" id="forgeMappingsVersion" placeholder="e.g. 1.20.1">
                    </div>
                    <div class="form-group">
                    </div>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>License:</label>
                        <div class="input-group">
                            <span class="input-icon">📜</span>
                            <div class="input-with-icon">
                                <input type="text" id="forgeLicense" value="MIT">
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Credits:</label>
                        <div class="input-group">
                            <span class="input-icon">🙌</span>
                            <div class="input-with-icon">
                                <input type="text" id="forgeCredits" placeholder="Optional credits">
                            </div>
                        </div>
                    </div>
                </div>
                <label class="checkbox-group">
                    <input type="checkbox" id="forgeUseMixins" checked>
                    <span>Include Mixin support</span>
                </label>
            </div>
        </div>

        <button onclick="createProject()">🚀 Create Project</button>
    </div>

    <script>
        const vscode = acquireVsCodeApi();

        const projectType = document.getElementById('projectType');
        const buildSystem = document.getElementById('buildSystem');
        const languageSelect = document.getElementById('language');
        const lombokCheckbox = document.getElementById('useLombok');
        
        const apiVersionGroup = document.getElementById('apiVersionGroup');
        const apiTypeGroup = document.getElementById('apiTypeGroup');
        
        const depTitle = document.getElementById('depTitle');
        const pluginConfig = document.getElementById('pluginConfig');
        const fabricConfig = document.getElementById('fabricConfig');
        const forgeConfig = document.getElementById('forgeConfig');

        const minecraftVersionSelect = document.getElementById('minecraftVersion');
        const loadingOverlay = document.getElementById('loadingOverlay');

        let versionData = {
            spigot: [],
            paper: [],
            fabric: [],
            forge: [],
            fabricApi: []
        };

        // Notify extension that we are ready
        vscode.postMessage({ command: 'ready' });

        window.addEventListener('message', event => {
            const message = event.data;
            if (message.command === 'setVersions') {
                versionData.spigot = message.spigot;
                versionData.paper = message.paper;
                versionData.fabric = message.fabric;
                versionData.forge = message.forge;
                versionData.fabricApi = message.fabricApi || [];
                
                updateVersionList();
                loadingOverlay.classList.add('hidden');
            } else if (message.command === 'setFabricDefaults') {
                document.getElementById('loomVersion').value = message.loom;
                document.getElementById('loaderVersion').value = message.loader;
                document.getElementById('yarnMappings').value = message.yarn;
                document.getElementById('fabricApiVersion').value = message.fabric;
            } else if (message.command === 'setForgeDefaults') {
                document.getElementById('forgeVersion').value = message.forge;
                document.getElementById('forgeMappingsChannel').value = message.mappingsChannel;
                document.getElementById('forgeMappingsVersion').value = message.mappingsVersion;
                if (message.javaVersion) {
                    document.getElementById('javaVersion').value = message.javaVersion;
                }
            }
        });

        function updateVersionList() {
            const type = projectType.value;
            const apiType = document.getElementById('apiType').value;
            minecraftVersionSelect.innerHTML = '';
            
            let filteredVersions = [];
            if (type === 'fabric') filteredVersions = versionData.fabric;
            else if (type === 'forge') filteredVersions = versionData.forge;
            else if (type === 'plugin' && apiType === 'paper') filteredVersions = versionData.paper;
            else filteredVersions = versionData.spigot;

            if (filteredVersions.length === 0) filteredVersions = versionData.spigot;

            filteredVersions.forEach(v => {
                const option = document.createElement('option');
                option.value = v;
                option.text = v;
                minecraftVersionSelect.appendChild(option);
            });

            // Trigger update of fabric/forge specific fields
            updatePlatformDefaults();
        }

        function updatePlatformDefaults() {
            const mcVersion = minecraftVersionSelect.value;
            const type = projectType.value;
            
            if (type === 'forge') {
                updateForgeDefaults(mcVersion);
            } else if (type === 'fabric') {
                updateFabricDefaults(mcVersion);
            }
        }

		function _forgeEraFromVersion(mcVersion) {
			if (!mcVersion) return 'fg6';
			const parts = mcVersion.split('.').map(Number);
			const major = parts[0], minor = parts[1] || 0;
			if (major === 1 && minor <= 12) return 'legacy';
			if (major === 1 && minor <= 16) return 'fg4';
			if (major === 1 && minor <= 18) return 'fg5';
			return 'fg6';
		}

		function updateForgeDefaults(version) {
			const era = _forgeEraFromVersion(version);
			const kotlinDslOption = [...buildSystem.options].find(opt => opt.value === 'gradle-kotlin');
			if (era === 'legacy' || era === 'fg4' || era === 'fg5') {
				if (kotlinDslOption) kotlinDslOption.disabled = true;
				if (buildSystem.value === 'gradle-kotlin') buildSystem.value = 'gradle';
			} else if (kotlinDslOption) {
				kotlinDslOption.disabled = false;
			}

			vscode.postMessage({ 
				command: 'getRecommendedVersions', 
				platform: 'forge', 
				minecraftVersion: version 
			});
		}

        function updateFabricDefaults(version) {
            // Re-enable Gradle Kotlin for Fabric if it was disabled by Forge
            const kotlinDslOption = [...buildSystem.options].find(opt => opt.value === 'gradle-kotlin');
            if (kotlinDslOption) {
                kotlinDslOption.disabled = false;
            }
            // Request recommended versions from extension
            vscode.postMessage({ 
                command: 'getRecommendedVersions', 
                platform: 'fabric', 
                minecraftVersion: version 
            });
        }

        minecraftVersionSelect.addEventListener('change', () => {
            updatePlatformDefaults();
        });

        document.getElementById('apiType').addEventListener('change', () => {
            if (projectType.value === 'plugin') {
                updateVersionList();
            }
        });

        projectType.addEventListener('change', () => {
            const type = projectType.value;
            updateVersionList();
            
            // Hide all platform sections first
            pluginConfig.classList.add('hidden');
            fabricConfig.classList.add('hidden');
            forgeConfig.classList.add('hidden');
            
            if (type === 'fabric') {
                apiVersionGroup.classList.add('hidden');
                apiTypeGroup.classList.add('hidden');
                fabricConfig.classList.remove('hidden');
                depTitle.innerText = "Fabric Configuration";
                buildSystem.value = 'gradle';
                for (let opt of buildSystem.options) if (opt.value === 'maven') opt.disabled = true;
            } else if (type === 'forge') {
                apiVersionGroup.classList.add('hidden');
                apiTypeGroup.classList.add('hidden');
                forgeConfig.classList.remove('hidden');
                depTitle.innerText = "Forge Configuration";
                buildSystem.value = 'gradle';
                for (let opt of buildSystem.options) if (opt.value === 'maven') opt.disabled = true;
            } else {
                apiVersionGroup.classList.remove('hidden');
                apiTypeGroup.classList.remove('hidden');
                pluginConfig.classList.remove('hidden');
                depTitle.innerText = "Dependencies";
                for (let opt of buildSystem.options) opt.disabled = false;
            }
        });

        languageSelect.addEventListener('change', () => {
            if (languageSelect.value === 'kotlin') {
                lombokCheckbox.checked = false;
                lombokCheckbox.disabled = true;
                lombokCheckbox.parentElement.style.opacity = '0.5';
            } else {
                lombokCheckbox.disabled = false;
                lombokCheckbox.parentElement.style.opacity = '1';
            }
        });

        function createProject() {
            const requiredFields = ['projectName', 'packageName', 'pluginVersion', 'authorName'];
            for (const field of requiredFields) {
                if (!document.getElementById(field).value) {
                    alert(`Please fill in the ${field}`);
                    return;
                }
            }

            const type = projectType.value;
            const data = {
                projectType: type,
                projectName: document.getElementById('projectName').value,
                packageName: document.getElementById('packageName').value,
                pluginVersion: document.getElementById('pluginVersion').value,
                authorName: document.getElementById('authorName').value,
                description: document.getElementById('description').value,
                website: document.getElementById('website').value,
                minecraftVersion: document.getElementById('minecraftVersion').value,
                apiVersion: document.getElementById('apiVersion').value,
                javaVersion: document.getElementById('javaVersion').value,
                apiType: document.getElementById('apiType').value,
                language: document.getElementById('language').value,
                buildSystem: document.getElementById('buildSystem').value,
                useLombok: document.getElementById('useLombok').checked,
                // Plugin specific
                dependencies: document.getElementById('dependencies').value,
                softDependencies: document.getElementById('softDependencies').value,
                // Fabric specific
                fabricApiVersion: document.getElementById('fabricApiVersion').value,
                loaderVersion: document.getElementById('loaderVersion').value,
                loomVersion: document.getElementById('loomVersion').value,
                yarnMappings: document.getElementById('yarnMappings').value,
                splitEnvironment: document.getElementById('fabricSplitEnv').checked,
                useMixins: type === 'fabric' ? document.getElementById('fabricUseMixins').checked : document.getElementById('forgeUseMixins').checked,
                // Forge specific
                forgeVersion: document.getElementById('forgeVersion').value,
                mappingsChannel: document.getElementById('forgeMappingsChannel').value,
                mappingsVersion: document.getElementById('forgeMappingsVersion').value,
                forgeLicense: document.getElementById('forgeLicense').value,
                forgeCredits: document.getElementById('forgeCredits').value
            };

            vscode.postMessage({
                command: 'createPlugin',
                data: data
            });
        }
    </script>
</body>
</html>
